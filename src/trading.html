<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading - Hyperliquid Dashboard</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Navigation Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2 class="logo">Hyperliquid</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <i data-feather="home"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item active">
                    <a href="trading.html" class="nav-link">
                        <i data-feather="trending-up"></i>
                        <span>Trading</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="portfolio.html" class="nav-link">
                        <i data-feather="briefcase"></i>
                        <span>Portfolio</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="market-data.html" class="nav-link">
                        <i data-feather="bar-chart-2"></i>
                        <span>Market Data</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="settings.html" class="nav-link">
                        <i data-feather="settings"></i>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1>Trading</h1>
                </div>
                <div class="header-right">
                    <div class="connection-status" id="connectionStatus">
                        <span class="status-indicator offline"></span>
                        <span class="status-text">Disconnected</span>
                    </div>
                </div>
            </header>

            <!-- Trading Content -->
            <div class="trading-content">
                <div class="trading-layout">
                    <!-- Order Form -->
                    <div class="order-panel">
                        <div class="panel-header">
                            <h3>Place Order</h3>
                        </div>
                        <div class="order-form">
                            <div class="order-tabs">
                                <button class="tab-btn active" data-tab="market">Market</button>
                                <button class="tab-btn" data-tab="limit">Limit</button>
                            </div>
                            
                            <form id="orderForm">
                                <div class="form-group">
                                    <label for="symbol">Symbol</label>
                                    <select id="symbol" name="symbol" required>
                                        <option value="">Select Symbol</option>
                                        <option value="BTC">BTC-USD</option>
                                        <option value="ETH">ETH-USD</option>
                                        <option value="SOL">SOL-USD</option>
                                    </select>
                                </div>
                                
                                <div class="form-group">
                                    <label for="side">Side</label>
                                    <div class="side-buttons">
                                        <button type="button" class="btn btn-buy" data-side="buy">Buy</button>
                                        <button type="button" class="btn btn-sell" data-side="sell">Sell</button>
                                    </div>
                                </div>
                                
                                <div class="form-group" id="priceGroup" style="display: none;">
                                    <label for="price">Price</label>
                                    <input type="number" id="price" name="price" step="0.01" placeholder="0.00">
                                </div>
                                
                                <div class="form-group">
                                    <label for="size">Size</label>
                                    <input type="number" id="size" name="size" step="0.001" placeholder="0.000" required>
                                </div>
                                
                                <button type="submit" class="btn btn-primary btn-full">Place Order</button>
                            </form>
                        </div>
                    </div>
                    
                    <!-- Market Info -->
                    <div class="market-panel">
                        <div class="panel-header">
                            <h3>Market Information</h3>
                        </div>
                        <div class="market-info" id="marketInfo">
                            <div class="info-item">
                                <span class="label">Last Price:</span>
                                <span class="value" id="lastPrice">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label">24h Change:</span>
                                <span class="value" id="priceChange">-</span>
                            </div>
                            <div class="info-item">
                                <span class="label">24h Volume:</span>
                                <span class="value" id="volume">-</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Open Orders -->
                <div class="orders-section">
                    <div class="section-header">
                        <h2>Open Orders</h2>
                        <button class="btn btn-secondary" onclick="refreshOrders()">
                            <i data-feather="refresh-cw"></i>
                            Refresh
                        </button>
                    </div>
                    <div class="orders-table" id="ordersTable">
                        <div class="no-orders">
                            <p>No open orders</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="lib/feather.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/trading.js"></script>
</body>
</html>
